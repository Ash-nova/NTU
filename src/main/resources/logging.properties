# java.util.logging configuration for EPRMS (loaded by LoggingConfig.init()).
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

.level=INFO

# Console: INFO and above, one line per message
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS %4$-7s [%3$s] %5$s%6$s%n

# File: eprms-0.log in the working directory (%u gives a unique number when
# several copies of the program run at once, e.g. a server and two clients)
java.util.logging.FileHandler.pattern=eprms-%u.log
java.util.logging.FileHandler.limit=1000000
java.util.logging.FileHandler.count=1
java.util.logging.FileHandler.append=true
java.util.logging.FileHandler.level=INFO
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# Hibernate is very chatty; only show its warnings
org.hibernate.level=WARNING
com.zaxxer.level=WARNING
